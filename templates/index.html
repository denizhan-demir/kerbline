<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>F1 Calendar</title>
</head>
<body>
    <h1>F1 Calendar</h1>
    <table>
        <tr>
            <th></th><th>#</th><th>Grand Prix</th><th>Country</th><th>Qualifying</th><th>Race</th>
        </tr>
        {% for race in races %}
        <tr>
            <td>{{ race.status }}</td>
            <td>{{ race.round }}</td>
            <td>{{ race.name }}</td>
            <td>{{ race.country }}</td>
            <td>{{ race.quali }}</td>
            <td>{{ race.race }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
