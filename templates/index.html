<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>F1 Calendar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>F1 Calendar</h1>
    <p class="note">All times are Budapest time.</p>

    {% for race in races %}
    <details class="race {{ race.status }}" {% if race.status == "next" %}open{% endif %}>
        <summary>
            <span class="round">{{ race.round }}</span>
            <span class="name">{{ race.name }} <small>{{ race.country }}</small></span>
            {% if race.status == "next" %}<span class="badge">NEXT</span>{% endif %}
            <span class="date">{{ race.date }}</span>
        </summary>
        <ul class="sessions">
            {% for session in race.sessions %}
            <li><span>{{ session.name }}</span><span>{{ session.time }}</span></li>
            {% endfor %}
        </ul>
    </details>
    {% endfor %}
</body>
</html>
